name: Update latest blog posts

on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update latest Medium articles
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: ${{ secrets.MEDIUM_RSS_FEED }}
          max_post_count: 5
          comment_tag_name: BLOG-POST-LIST
          commit_message: "docs: update latest blog posts"
